# SharePoint のファイルを実際に更新する本番用ワークフローです。
# GitHub 上では手動で無効にしてあります。

name: Python application

on:
  schedule:
    # Ref: https://crontab.guru/
    - cron: '0 3 * * 3'

permissions:
  contents: read

env:
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - name: Run
        run: uv run --no-dev python main.py
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          USER_OBJECT_ID: ${{ secrets.USER_OBJECT_ID }}
          TARGET_SITE_ID: ${{ secrets.TARGET_SITE_ID }}
          TARGET_FILE_PATH: ${{ secrets.TARGET_FILE_PATH }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_MESSAGE_CHANNEL: ${{ secrets.SLACK_MESSAGE_CHANNEL }}
          SLACK_MESSAGE_SUCCESS: ${{ secrets.SLACK_MESSAGE_SUCCESS }}
          SLACK_MESSAGE_FAILURE: ${{ secrets.SLACK_MESSAGE_FAILURE }}

      # 成功時はこちらのステップが実行されます。
      - name: Slack Notification on Success
        if: success()
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_TITLE: SharePointMaid succeeded
          SLACK_COLOR: good

      # 失敗時はこちらのステップが実行されます。
      - name: Slack Notification on Failure
        if: failure()
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_TITLE: SharePointMaid failed
          SLACK_COLOR: danger

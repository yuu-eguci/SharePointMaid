name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker compose build
      - name: Lint
        run: docker compose run --rm app uv run ruff check .
      - name: Format
        run: docker compose run --rm app uv run ruff format --check .
      - name: Test
        run: docker compose run --rm app uv run pytest
